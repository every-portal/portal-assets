<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機種情報＆見分け方ガイド</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f4ff;
            --bg-surface: #eef2f7;
            --accent: #2563eb;
            --accent-light: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.08);
            --green: #059669;
            --amber: #d97706;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-dim: #94a3b8;
            --text: #0f172a;
            --bg-hover: #f0f4ff;
            --border: #e5e7eb;
            --border-accent: rgba(37, 99, 235, 0.25);
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d27;
            --bg-card: #1e2130;
            --bg-card-hover: #252a3a;
            --bg-surface: #161922;
            --accent: #4f8fff;
            --accent-light: #6ba1ff;
            --accent-glow: rgba(79, 143, 255, 0.12);
            --green: #34d399;
            --amber: #fbbf24;
            --text-primary: #e8eaf0;
            --text-secondary: #9ba3b5;
            --text-dim: #5d6578;
            --text: #e8eaf0;
            --bg-hover: #252a3a;
            --border: #2a2e3d;
            --border-accent: rgba(79, 143, 255, 0.3);
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-hero {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--accent-glow) 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 32px;
            margin-bottom: 28px;
        }
        .welcome-hero h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
        .welcome-hero p { color: var(--text-secondary); font-size: 0.92rem; }

        .device-category {
            margin-bottom: 32px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .category-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }

        .category-icon.iphone { background: rgba(59,130,246,0.12); }
        .category-icon.ipad { background: rgba(129,140,248,0.12); }
        .category-icon.android { background: rgba(52,211,153,0.12); }
        .category-icon.other { background: rgba(251,191,36,0.12); }

        .category-name {
            font-size: 16px;
            font-weight: 700;
        }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .device-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            color: inherit;
            font-size: 14px;
            font-weight: 500;
        }

        .device-card:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
            color: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(37,99,235,0.1);
        }

        .device-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }


        .category-header {
            cursor: pointer;
            user-select: none;
        }
        .category-header:hover {
            background: rgba(37,99,235,0.03);
            border-radius: 8px 8px 0 0;
        }
        .category-toggle {
            margin-left: auto;
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim);
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }
        .category-toggle svg {
            width: 18px; height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .device-category.collapsed .category-toggle {
            transform: rotate(-90deg);
        }
        .device-category .device-grid {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease;
            opacity: 1;
        }
        .device-category.collapsed .device-grid {
            max-height: 0;
            opacity: 0;
            padding: 0;
            margin: 0;
        }
        .category-count {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 500;
            margin-left: 8px;
            background: var(--bg-surface);
            padding: 2px 10px;
            border-radius: 20px;
        }



        .manual-iframe-wrapper {
            display: none;
            position: relative;
        }
        .manual-iframe-wrapper.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .iframe-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            margin-bottom: 16px;
        }
        .iframe-back:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .iframe-back svg {
            width: 16px; height: 16px;
            stroke: currentColor; stroke-width: 2; fill: none;
        }

        @media (max-width: 600px) {
            .device-grid {
                grid-template-columns: 1fr 1fr;
            }
            body { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="welcome-hero">
        <h1>📱 機種情報＆見分け方ガイド</h1>
        <p>外観・スペックから端末の機種を見分けるためのガイドです。機種を選択すると詳細が表示されます。</p>
    </div>

    <!-- カテゴリタブ -->
    <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;" id="idCatTabs">
        <button class="detail-tab active" onclick="switchIdCat('iphone',this)" style="padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;">📱 iPhone</button>
        <button class="detail-tab" onclick="switchIdCat('ipad',this)" style="padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;">📱 iPad</button>
        <button class="detail-tab" onclick="switchIdCat('applewatch',this)" style="padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;">⌚ Apple Watch</button>
        <button class="detail-tab" onclick="switchIdCat('ipod',this)" style="padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;">🎵 iPod</button>
        <button class="detail-tab" onclick="switchIdCat('android',this)" style="padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;">🤖 Android</button>
        <button class="detail-tab" onclick="switchIdCat('switch',this)" style="padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;">🎮 Switch</button>
    </div>

    <!-- デバイスリスト -->
    <div id="idDeviceList"></div>

    <!-- デバイス詳細 -->
    <div class="manual-iframe-wrapper" id="idDetailWrap">
        <button class="iframe-back" onclick="closeIdDetail()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            機種一覧に戻る
        </button>
        <div id="idDetailContent"></div>
    </div>

    // テーマ引き継ぎ（親からのメッセージ or URLパラメータ）
    (function() {
        var params = new URLSearchParams(window.location.search);
        var theme = params.get('theme');
        if (theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'theme-change') {
                document.documentElement.setAttribute('data-theme', e.data.theme);
            }
        });
        // ローカルストレージからも取得（フォールバック）
        try {
            var stored = localStorage.getItem('portal-theme');
            if (stored && !theme) {
                document.documentElement.setAttribute('data-theme', stored);
            }
        } catch(ex) {}
    })();

    var currentIdCat = 'iphone';

    function switchIdCat(cat, btn) {
        currentIdCat = cat;
        document.querySelectorAll('#idCatTabs button').forEach(function(b){ b.style.background='var(--bg-card)'; b.style.color='var(--text)'; });
        btn.style.background='var(--accent)'; btn.style.color='#fff';
        closeIdDetail();
        renderIdList(cat);
    }

    function renderIdList(cat) {
        var data = idData[cat];
        var html = '';
        for (var group in data) {
            html += '<div class="device-category"><div class="category-header"><div class="category-icon iphone">' +
                (cat==='iphone'?'📱':cat==='ipad'?'📱':cat==='applewatch'?'⌚':cat==='ipod'?'🎵':cat==='android'?'🤖':'🎮') +
                '</div><div class="category-name">' + group + '</div></div><div class="device-grid">';
            data[group].forEach(function(d, i){
                html += '<a href="#" class="device-card" onclick="event.preventDefault();openIdDetail(\'' + cat + '\',\'' + group.replace(/'/g,"\\'") + '\',' + i + ')"><span class="device-dot"></span>' + d.n + '</a>';
            });
            html += '</div></div>';
        }
        document.getElementById('idDeviceList').innerHTML = html;
    }

    function openIdDetail(cat, group, idx) {
        var d = idData[cat][group][idx];
        var colors = d.col.split(',');
        var colorBadges = colors.map(function(c){ return '<span style="display:inline-block;padding:3px 10px;border-radius:12px;background:var(--bg-hover);font-size:12px;margin:2px;">' + c.trim() + '</span>'; }).join('');

        var html = '<div style="margin-bottom:24px;">' +
            '<h2 style="margin:0 0 4px 0;font-size:1.4rem;">' + d.n + '</h2>' +
            '<p style="margin:0;color:var(--text-secondary);font-size:0.9rem;">' + d.y + '年発売</p></div>';

        // 画像表示
        if (d.imgs && d.imgs.length > 0) {
            html += '<div style="margin-bottom:24px;">' +
                '<div style="position:relative;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;overflow:hidden;">' +
                '<img id="idMainImg" src="' + d.imgs[0].src + '" style="max-height:320px;max-width:100%;object-fit:contain;border-radius:8px;" alt="' + d.n + '">' +
                '<p id="idMainImgLabel" style="margin:10px 0 0;font-size:0.85rem;color:var(--text-secondary);font-weight:600;">' + d.imgs[0].lb + '</p></div>' +
                '<div style="display:flex;gap:6px;overflow-x:auto;padding:10px 0;-webkit-overflow-scrolling:touch;">';
            d.imgs.forEach(function(img, ii){
                html += '<img src="' + img.src + '" onclick="document.getElementById(\'idMainImg\').src=\'' + img.src + '\';document.getElementById(\'idMainImgLabel\').textContent=\'' + img.lb.replace(/'/g,"\\'") + '\';this.parentElement.querySelectorAll(\'img\').forEach(function(t){t.style.border=\'2px solid transparent\';});this.style.border=\'2px solid var(--accent)\';" style="height:56px;width:56px;object-fit:cover;border-radius:8px;cursor:pointer;flex-shrink:0;border:2px solid ' + (ii===0?'var(--accent)':'transparent') + ';" alt="' + img.lb + '">';
            });
            html += '</div></div>';
        } else {
            html += '<div style="background:var(--bg-hover);border-radius:12px;padding:32px;text-align:center;margin-bottom:24px;border:2px dashed var(--border);">' +
                '<div style="font-size:48px;margin-bottom:8px;">📷</div>' +
                '<p style="margin:0;color:var(--text-secondary);font-size:0.9rem;">画像は準備中です</p></div>';
        }

        // スペック表
        html += '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;">' +
            '<h3 style="margin:0 0 14px 0;font-size:1rem;">📋 基本スペック</h3>' +
            '<table style="width:100%;border-collapse:collapse;font-size:0.9rem;">';
        var specs = [
            ['画面サイズ', d.d], ['チップ', d.ch], ['コネクタ', d.cn],
            ['生体認証', d.bio], ['重量', d.w], ['サイズ', d.sz], ['型番', d.mn]
        ];
        specs.forEach(function(s){
            html += '<tr><td style="padding:8px 12px;border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;width:100px;color:var(--text-secondary);">' + s[0] + '</td><td style="padding:8px 12px;border-bottom:1px solid var(--border);">' + s[1] + '</td></tr>';
        });
        html += '<tr><td style="padding:8px 12px;font-weight:600;white-space:nowrap;color:var(--text-secondary);">カラー</td><td style="padding:8px 12px;">' + colorBadges + '</td></tr>';
        html += '</table></div>';

        // 見分け方ポイント
        html += '<div style="background:linear-gradient(135deg,rgba(59,130,246,0.08),rgba(139,92,246,0.08));border:1px solid var(--border-accent);border-radius:12px;padding:20px;margin-bottom:20px;">' +
            '<h3 style="margin:0 0 10px 0;font-size:1rem;">🔍 見分けポイント</h3>' +
            '<p style="margin:0;line-height:1.7;font-size:0.92rem;">' + d.tip + '</p></div>';

        // ミニクイズ
        if (d.quiz) {
            html += '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;" id="idQuizBox">' +
                '<h3 style="margin:0 0 14px 0;font-size:1rem;">🧩 確認クイズ</h3>' +
                '<p style="margin:0 0 14px 0;font-weight:600;">' + d.quiz.q + '</p>';
            d.quiz.o.forEach(function(opt, oi){
                html += '<button onclick="checkIdQuiz(' + oi + ',' + d.quiz.a + ',this)" style="display:block;width:100%;text-align:left;padding:10px 16px;margin-bottom:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);cursor:pointer;font-size:0.9rem;color:var(--text);transition:all 0.2s;">' + opt + '</button>';
            });
            html += '<div id="idQuizResult" style="margin-top:10px;font-weight:600;display:none;"></div></div>';
        }

        document.getElementById('idDetailContent').innerHTML = html;
        document.getElementById('idDeviceList').style.display = 'none';
        document.getElementById('idCatTabs').style.display = 'none';
        document.getElementById('idDetailWrap').classList.add('active');
        window.scrollTo({ top: document.getElementById('idDetailWrap').offsetTop - 80, behavior: 'smooth' });
    }

    function closeIdDetail() {
        document.getElementById('idDetailWrap').classList.remove('active');
        document.getElementById('idDeviceList').style.display = '';
        document.getElementById('idCatTabs').style.display = '';
    }

    function checkIdQuiz(selected, correct, btn) {
        var buttons = btn.parentElement.querySelectorAll('button');
        buttons.forEach(function(b, i){
            b.disabled = true;
            b.style.cursor = 'default';
            if (i === correct) { b.style.background = 'rgba(34,197,94,0.15)'; b.style.borderColor = '#22c55e'; b.style.color = '#16a34a'; }
            if (i === selected && selected !== correct) { b.style.background = 'rgba(239,68,68,0.15)'; b.style.borderColor = '#ef4444'; b.style.color = '#dc2626'; }
        });
        var res = document.getElementById('idQuizResult');
        res.style.display = 'block';
        res.textContent = selected === correct ? '✅ 正解！' : '❌ 不正解… 正しい答えを確認してください';
        res.style.color = selected === correct ? '#16a34a' : '#dc2626';
    }

    // 初期描画
    renderIdList('iphone');



    // Collapsible device categories
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.device-category').forEach(function(cat) {
            cat.classList.add('collapsed');
            var header = cat.querySelector('.category-header');
            var grid = cat.querySelector('.device-grid');
            var count = grid ? grid.querySelectorAll('.device-card').length : 0;
            var nameEl = header.querySelector('.category-name');
            if (nameEl && count > 0) {
                var badge = document.createElement('span');
                badge.className = 'category-count';
                badge.textContent = count + '機種';
                nameEl.appendChild(badge);
            }
            var toggle = document.createElement('div');
            toggle.className = 'category-toggle';
            toggle.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
            header.appendChild(toggle);
            header.addEventListener('click', function() {
                cat.classList.toggle('collapsed');
            });
        });
    });
</script>
