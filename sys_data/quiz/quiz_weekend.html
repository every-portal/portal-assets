function _ln(){try{return localStorage.getItem(SK+"-n")||"";}catch(e){return"";}}
function _sn(n){try{localStorage.setItem(SK+"-n",n);}catch(e){}}

function sub(r){
  if(!SCRIPT_URL){S.ss="no-url";R();return;}
  S.ss="sending";R();
  var dc=DIFF_CFG[r.diff];
  var p={name:S.name,date:r.date,score:r.score,correct:r.correct,total:r.total,passed:r.passed,quiz:TITLE,
    difficulty:dc?dc.label:"",
    answers:r.ans.map(function(a){return{category:a.q.cat||"",question:a.q.q,selected:a.sel,answer:a.q.a,correct:a.ok,time:a.tm};})
  };
  fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(p)})
    .then(function(){S.ss="ok";R();})
    .catch(function(){S.ss="fail";R();});
}

// Filter by level, shuffle, pick n. Answers also shuffled.
function gq(diffIdx){
  var cfg=DIFF_CFG[diffIdx];
  var lv=diffIdx+1;
  // For higher levels, include questions from lower levels too
  var pool=QS.filter(function(q){return q.lv<=lv;});
  pool.sort(function(){return Math.random()-0.5;});
  // Prioritize current level questions
  var thisLv=pool.filter(function(q){return q.lv===lv;});
  var lowerLv=pool.filter(function(q){return q.lv<lv;});
  thisLv.sort(function(){return Math.random()-0.5;});
  lowerLv.sort(function(){return Math.random()-0.5;});
  var merged=thisLv.concat(lowerLv).slice(0,cfg.n);
  merged.sort(function(){return Math.random()-0.5;});
  // Shuffle answer options for each question
  return merged.map(function(q){
    var oidx=q.o.map(function(o,i){return{o:o,i:i};});
    oidx.sort(function(){return Math.random()-0.5;});
    return{q:q.q,o:oidx.map(function(x){return x.o;}),a:q.a,cat:q.cat,lv:q.lv};
  });
}

function stm(){clearInterval(ti);S.tm=0;ti=setInterval(function(){S.tm++;var e=document.getElementById("tm");if(e){var t=S.tm;e.style.background=t>20?"#fef2f2":t>10?"#fffbeb":"#f0fdf4";e.style.color=t>20?"#dc2626":t>10?"#d97706":"#16a34a";e.textContent="⏱ "+t+"秒";}},1000);}
function st(){clearInterval(ti);}

function setN(){var e=document.getElementById("ni");if(e&&e.value.trim()){S.name=e.value.trim();_sn(S.name);R();}}
function edN(){S.name="";R();setTimeout(function(){var e=document.getElementById("ni");if(e)e.focus();},50);}

function go(di){
  if(!S.name){alert("名前を入力してください");return;}
  S.diff=di;S.qs=gq(di);S.cur=0;S.ans=[];S.sel=null;S.fb=false;S.tm=0;S.ss="";S.screen="quiz";R();stm();
}

function ans(idx){if(S.fb)return;var q=S.qs[S.cur];var o=q.o[idx];S.sel=o;S.fb=true;st();var ok=(o===q.a);S.ans.push({q:q,sel:o,ok:ok,tm:S.tm});R();setTimeout(function(){if(S.cur<S.qs.length-1){S.cur++;S.sel=null;S.fb=false;S.tm=0;R();stm();}else{fin();}},ok?800:2200);}
function fin(){st();var c=S.ans.filter(function(a){return a.ok;}).length;var s=Math.round(c/S.ans.length*100);var rec={date:new Date().toLocaleString("ja-JP"),score:s,total:S.ans.length,correct:c,passed:s>=PASS,diff:S.diff,ans:S.ans,name:S.name};S.hist=[rec].concat(S.hist).slice(0,50);sh(S.hist);S.screen="result";R();sub(rec);}
function hm(){st();S.screen="home";R();}
function hs(){S.screen="history";R();}
function rs(){if(confirm("全履歴を削除しますか？")){S.hist=[];sh([]);R();}}
function qt(){if(confirm("テストを中断しますか？"))hm();}

function R(){
  var a=document.getElementById("app");
  switch(S.screen){
    case "home":a.innerHTML=rH();break;
    case "quiz":a.innerHTML=rQ();break;
    case "result":a.innerHTML=rR();break;
    case "history":a.innerHTML=rHi();break;
  }
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function rH(){
  var cn=SCRIPT_URL?'<div class="cn co">● Spreadsheet連携ON</div>':'<div class="cn cf">● オフライン</div>';
  var nm;
  if(S.name){
    nm='<div class="ns">👤 '+esc(S.name)+' さん<button class="ne" onclick="edN()">変更</button></div>';
  } else {
    nm='<div style="display:flex;gap:8px"><input class="ni" id="ni" placeholder="名前を入力"><button style="padding:8px 16px;border-radius:10px;border:none;background:'+CM+';color:#fff;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap" onclick="setN()">決定</button></div>';
  }
  var dc=S.name?"":"off";
  var btns="";
  for(var i=0;i<DIFF_CFG.length;i++){
    var d=DIFF_CFG[i];
    btns+='<button class="db '+dc+'" style="border-color:'+d.color+';background:'+d.bg+'" onclick="go('+i+')"><div style="display:flex;align-items:center"><span class="dg" style="background:'+d.color+'">'+d.label+'</span><span style="font-size:13px;color:#475569;margin-left:10px">'+d.n+'問</span></div><span style="font-size:18px;color:'+d.color+'">→</span></button>';
  }
  var mi="";
  if(S.hist.length>0){
    var ms="";
    for(var i=0;i<Math.min(5,S.hist.length);i++){
      var r=S.hist[i];var bg=r.passed?"#f0fdf4":"#fef2f2";var bc=r.passed?"#bbf7d0":"#fecaca";var sc=r.passed?"#16a34a":"#dc2626";
      var ds=(r.date.split(" ")[0]||"").split("/").slice(1).join("/");
      ms+='<div class="mi" style="background:'+bg+';border-color:'+bc+'"><div style="font-size:18px;font-weight:800;color:'+sc+'">'+r.score+'%</div><div style="font-size:9px;color:#94a3b8">'+ds+'</div></div>';
    }
    mi='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-size:13px;font-weight:700;color:#1b2a4a">最近の結果</span><button class="lb" onclick="hs()">履歴 →</button></div><div class="mr">'+ms+'</div></div>';
  }
  return '<div class="header"><div style="font-size:11px;font-weight:700;color:'+CM+';letter-spacing:2px">'+TAG+'</div>'
    +'<h1 style="font-size:34px;font-weight:900;color:#fff;margin:8px 0 0;line-height:1.2">'+TITLE+'</h1>'
    +'<div style="font-size:13px;color:#94a3b8;margin-top:8px">全'+QS.length+'問から出題</div>'+cn+'</div>'
    +'<div class="body"><div class="card"><div class="card-title">受験者名</div>'+nm+'</div>'
    +'<div class="card"><div class="card-title">難易度を選択</div>'+btns+'</div>'+mi
    +'<div class="card card-dark"><div style="font-size:12px;font-weight:700;color:'+CM+';margin-bottom:6px">合格ライン</div>'
    +'<div style="font-size:28px;font-weight:800;color:#fff">'+PASS+'%<span style="font-size:14px;color:#94a3b8;margin-left:8px">以上で合格</span></div></div></div>';
}

function rQ(){
  var q=S.qs[S.cur];var pr=(S.cur/S.qs.length*100).toFixed(0);
  var op="";
  for(var i=0;i<q.o.length;i++){
    var o=q.o[i];var c="ob";var r="";
    if(S.fb){
      if(o===q.a){c+=" ok";r='<span style="font-size:18px;margin-left:auto">✓</span>';}
      else if(o===S.sel){c+=" ng";r='<span style="font-size:18px;margin-left:auto">✗</span>';}
      else{c+=" fd";}
      c+=" off";
    }
    op+='<button class="'+c+'" onclick="ans('+i+')"><span class="ol">'+String.fromCharCode(65+i)+'</span><span style="flex:1;text-align:left">'+esc(o)+'</span>'+r+'</button>';
  }
  var fb="";
  if(S.fb&&S.sel!==q.a){fb='<div class="fb"><div style="font-weight:700;color:#dc2626;font-size:13px">不正解</div><div style="font-size:12px;color:#64748b">正解：'+esc(q.a)+'</div></div>';}
  return '<div class="qt"><button class="cb" onclick="qt()">✕</button><div class="pw"><div class="pb" style="width:'+pr+'%"></div></div><div class="qc">'+(S.cur+1)+'/'+S.qs.length+'</div></div>'
    +'<div class="tr"><div class="tb" id="tm" style="background:#f0fdf4;color:#16a34a">⏱ 0秒</div></div>'
    +'<div class="qa"><div class="tt">'+(q.cat||"")+'</div><h2 class="qx">'+esc(q.q)+'</h2></div>'
    +'<div class="os">'+op+'</div>'+fb;
}

function rR(){
  var r=S.hist[0];if(!r)return"";
  var ss="";
  if(S.ss==="sending")ss='<div class="ss sn">📡 送信中...</div>';
  else if(S.ss==="ok")ss='<div class="ss so">✅ 記録済み</div>';
  else if(S.ss==="fail")ss='<div class="ss sf">⚠ 送信失敗</div>';
  else if(S.ss==="no-url")ss='<div class="ss sf">未接続</div>';

  var wt={};
  for(var i=0;i<r.ans.length;i++){var a=r.ans[i];var t=a.q.cat||"その他";if(!wt[t])wt[t]={t:0,w:0};wt[t].t++;if(!a.ok)wt[t].w++;}
  var wl=Object.keys(wt).filter(function(k){return wt[k].w>0;}).sort(function(a,b){return wt[b].w-wt[a].w;});
  var wh="";
  if(wl.length>0){
    wh='<div class="card"><div class="card-title">苦手分野</div>';
    for(var i=0;i<wl.length;i++){var t=wl[i];wh+='<div class="wr"><span style="font-size:12px;color:#475569">'+esc(t)+'</span><span style="font-size:12px;font-weight:700;color:#dc2626">'+wt[t].w+'問ミス/'+wt[t].t+'問</span></div>';}
    wh+='</div>';
  }
  var wr=r.ans.filter(function(a){return!a.ok;});
  var wrh="";
  if(wr.length===0){wrh='<div style="font-size:12px;color:#16a34a;font-weight:600">全問正解！ 🎉</div>';}
  else{for(var i=0;i<wr.length;i++){var a=wr[i];wrh+='<div class="wi"><div style="font-size:11px;color:#dc2626;font-weight:700">Q. '+esc(a.q.q)+'</div><div style="font-size:11px;color:#64748b;margin-top:2px">回答：<span style="color:#dc2626;font-weight:600">'+esc(a.sel)+'</span>　正解：<span style="color:#16a34a;font-weight:600">'+esc(a.q.a)+'</span></div></div>';}}
  var dc=DIFF_CFG[r.diff];var dl=dc?dc.label:"";
  return '<div class="rh '+(r.passed?"ps":"fl")+'">'
    +'<div style="font-size:48px">'+(r.passed?"🎉":"📝")+'</div>'
    +'<div style="font-size:14px;color:rgba(255,255,255,0.8);font-weight:600">'+(r.passed?"合格！":"不合格")+'</div>'
    +'<div style="font-size:56px;font-weight:800;color:#fff;line-height:1">'+r.score+'%</div>'
    +'<div style="font-size:13px;color:rgba(255,255,255,0.7);margin-top:4px">'+r.correct+'/'+r.total+'問（'+dl+'）- '+esc(r.name)+'</div>'+ss+'</div>'
    +'<div class="body" style="padding-top:16px">'+wh
    +'<div class="card"><div class="card-title">'+(wr.length>0?"間違えた問題":"結果")+'</div>'+wrh+'</div>'
    +'<div class="br"><button class="p1" onclick="go('+r.diff+')">もう一度</button><button class="p2" onclick="hm()">ホーム</button></div></div>';
}

function rHi(){
  var h=S.hist;
  if(!h.length)return '<div class="hh"><button class="bb" onclick="hm()">← 戻る</button><h2 style="font-size:18px;font-weight:800;color:#1b2a4a">履歴</h2></div><div class="body" style="text-align:center;padding:40px;color:#94a3b8">記録なし</div>';
  var mx=0;var pc=0;
  for(var i=0;i<h.length;i++){if(h[i].score>mx)mx=h[i].score;if(h[i].passed)pc++;}
  var items="";
  for(var i=0;i<h.length;i++){
    var r=h[i];var dc=DIFF_CFG[r.diff];var dl=dc?dc.label:"";
    items+='<div class="card" style="padding:0"><div class="hi"><div class="hs" style="background:'+(r.passed?"#f0fdf4":"#fef2f2")+'"><span style="font-size:20px;font-weight:800;color:'+(r.passed?"#16a34a":"#dc2626")+'">'+r.score+'</span></div>'
      +'<div style="flex:1"><div style="font-size:13px;font-weight:700;color:#1b2a4a">'+(r.passed?"合格":"不合格")+' '+r.correct+'/'+r.total+' ('+dl+')'+(r.name?" - "+esc(r.name):"")+'</div>'
      +'<div style="font-size:11px;color:#94a3b8">'+r.date+'</div></div>'
      +'<div class="pg" style="background:'+(r.passed?"#dcfce7":"#fecaca")+';color:'+(r.passed?"#166534":"#991b1b")+'">'+(r.passed?"PASS":"FAIL")+'</div></div></div>';
  }
  return '<div class="hh"><button class="bb" onclick="hm()">← 戻る</button><h2 style="font-size:18px;font-weight:800;color:#1b2a4a">履歴</h2></div>'
    +'<div class="body"><div class="card card-dark"><div style="display:flex;justify-content:space-around;text-align:center">'
    +'<div><div style="font-size:24px;font-weight:800;color:'+CM+'">'+h.length+'</div><div style="font-size:10px;color:#94a3b8">受験</div></div>'
    +'<div><div style="font-size:24px;font-weight:800;color:#16a34a">'+pc+'</div><div style="font-size:10px;color:#94a3b8">合格</div></div>'
    +'<div><div style="font-size:24px;font-weight:800;color:#fff">'+mx+'%</div><div style="font-size:10px;color:#94a3b8">最高</div></div>'
    +'</div></div>'+items+'<button class="rb" onclick="rs()">履歴リセット</button></div>';
}

document.addEventListener("keydown",function(e){if(e.key==="Enter"){var ni=document.getElementById("ni");if(ni&&document.activeElement===ni)setN();}});
S.hist=lh();S.name=_ln();R();
</script>
</body>
</html>
