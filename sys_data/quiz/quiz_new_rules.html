<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>新ルール理解チェック</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',system-ui,sans-serif;background:#f1f5f9;min-height:100dvh;display:flex;align-items:center;justify-content:center}
.wrap{max-width:430px;width:100%;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:16px;padding:48px 32px;text-align:center;border:1px solid #e2e8f0;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
.icon{font-size:64px;margin-bottom:20px}
h1{font-size:22px;font-weight:800;color:#0f172a;margin-bottom:8px}
p{font-size:14px;color:#64748b;margin-bottom:24px;line-height:1.7}
.badge{display:inline-block;background:#d97706;color:#fff;font-size:13px;font-weight:700;padding:6px 20px;border-radius:20px}
.back{display:block;margin-top:24px;color:#0891b2;font-size:13px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="icon">📖</div>
<h1>新ルール理解チェック</h1>
<p>新しく追加・変更されたルールの理解度を確認するテストです。<br>現在、問題を準備中です。</p>
<span class="badge">準備中</span>
<a href="javascript:window.close()" class="back">← 閉じる</a>
</div>
</div>
</body>
</html>
