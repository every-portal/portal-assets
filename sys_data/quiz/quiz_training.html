  var mi="";
  if(S.hist.length>0){
    var ms="";for(var i=0;i<Math.min(5,S.hist.length);i++){var r=S.hist[i];var bg=r.passed?"#f0fdf4":"#fef2f2";var bc=r.passed?"#bbf7d0":"#fecaca";var sc=r.passed?"#16a34a":"#dc2626";var ds=(r.date.split(" ")[0]||"").split("/").slice(1).join("/");ms+='<div class="mi" style="background:'+bg+';border-color:'+bc+'"><div style="font-size:18px;font-weight:800;color:'+sc+'">'+r.score+'%</div><div style="font-size:9px;color:#94a3b8">'+ds+'</div></div>';}
    mi='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-size:13px;font-weight:700;color:#1b2a4a">最近の結果</span><button class="lb" onclick="hs()">履歴 →</button></div><div class="mr">'+ms+'</div></div>';
  }
  return '<div class="header"><div style="font-size:11px;font-weight:700;color:'+CM+';letter-spacing:2px">'+TAG+'</div>'
    +'<h1 style="font-size:28px;font-weight:900;color:#fff;margin:8px 0 0;line-height:1.2">'+TITLE+'</h1>'
    +'<div style="font-size:13px;color:#94a3b8;margin-top:8px">4分野×10問 = 全40問</div>'+cn+'</div>'
    +'<div class="body"><div class="card"><div class="card-title">受験者名</div>'+nm+'</div>'
    +'<div class="card"><div class="card-title">テスト内容</div>'
    +'<div style="font-size:12px;color:#475569;line-height:1.8;margin-bottom:12px">'
    +'<span class="sec-badge" style="background:#dc262615;color:#dc2626">🛡️ 会社ルール 10問</span>'
    +'<span class="sec-badge" style="background:#2563eb15;color:#2563eb">📚 知識 10問</span><br>'
    +'<span class="sec-badge" style="background:#059669 15;color:#059669">📋 事務作業 10問</span>'
    +'<span class="sec-badge" style="background:#0891b215;color:#0891b2">🔧 修理 10問</span>'
    +'</div>'
    +'<button class="db '+dc+'" style="border-color:#8b5cf6;background:#faf5ff" onclick="go()"><div style="display:flex;align-items:center"><span class="dg" style="background:#8b5cf6">入社テスト</span><span style="font-size:13px;color:#475569;margin-left:10px">40問</span></div><span style="font-size:18px;color:#8b5cf6">→</span></button>'
    +'</div>'+mi
    +'<div class="card card-dark"><div style="font-size:12px;font-weight:700;color:'+CM+';margin-bottom:6px">合格ライン</div>'
    +'<div style="font-size:28px;font-weight:800;color:#fff">'+PASS+'%<span style="font-size:14px;color:#94a3b8;margin-left:8px">以上で合格</span></div></div></div>';
}

function rQ(){
  var q=S.qs[S.cur];var pr=(S.cur/S.qs.length*100).toFixed(0);
  var op="";
  for(var i=0;i<q.o.length;i++){var o=q.o[i];var c="ob";var r="";if(S.fb){if(o===q.a){c+=" ok";r='<span style="font-size:18px;margin-left:auto">✓</span>';}else if(o===S.sel){c+=" ng";r='<span style="font-size:18px;margin-left:auto">✗</span>';}else{c+=" fd";}c+=" off";}op+='<button class="'+c+'" onclick="ans('+i+')"><span class="ol">'+String.fromCharCode(65+i)+'</span><span style="flex:1;text-align:left">'+esc(o)+'</span>'+r+'</button>';}
  var fb="";if(S.fb&&S.sel!==q.a)fb='<div style="padding:8px 16px;font-size:12px;color:#dc2626;font-weight:700">正解：'+esc(q.a)+'</div>';
  return '<div class="qt"><button class="cb" onclick="qt()">✕</button><div class="pw"><div class="pb" style="width:'+pr+'%"></div></div><div class="qc">'+(S.cur+1)+'/'+S.qs.length+'</div></div>'
    +'<div class="tr"><div class="tb" id="tm" style="background:#f0fdf4;color:#16a34a">⏱ 0秒</div></div>'
    +'<div class="qa"><div class="tt">'+esc(q.cat||"")+'</div><h2 class="qx">'+esc(q.q)+'</h2></div>'
    +'<div class="os">'+op+'</div>'+fb;
}

function rR(){
  var r=S.hist[0];if(!r)return"";
  var ss="";
  if(S.ss==="sending")ss='<div class="ss sn">📡 送信中...</div>';
  else if(S.ss==="ok")ss='<div class="ss so">✅ 記録済み</div>';
  else if(S.ss==="fail")ss='<div class="ss sf">⚠ 送信失敗</div>';
  else if(S.ss==="no-url")ss='<div class="ss sf">未接続</div>';
  var wt={};for(var i=0;i<r.ans.length;i++){var a=r.ans[i];var t=a.q.cat||"その他";if(!wt[t])wt[t]={t:0,w:0};wt[t].t++;if(!a.ok)wt[t].w++;}
  var wl=Object.keys(wt).filter(function(k){return wt[k].w>0;}).sort(function(a,b){return wt[b].w-wt[a].w;});
  var wh="";if(wl.length>0){wh='<div class="card"><div class="card-title">苦手分野</div>';for(var i=0;i<wl.length;i++){var t=wl[i];wh+='<div class="wr"><span style="font-size:12px;color:#475569">'+esc(t)+'</span><span style="font-size:12px;font-weight:700;color:#dc2626">'+wt[t].w+'問ミス/'+wt[t].t+'問</span></div>';}wh+='</div>';}
  var wr=r.ans.filter(function(a){return!a.ok;});var wrh="";
  if(wr.length===0)wrh='<div style="font-size:12px;color:#16a34a;font-weight:600">全問正解！ 🎉</div>';
  else{for(var i=0;i<wr.length;i++){var a=wr[i];wrh+='<div class="wi"><div style="font-size:11px;color:#dc2626;font-weight:700">Q. '+esc(a.q.q)+'</div><div style="font-size:11px;color:#64748b;margin-top:2px">回答：<span style="color:#dc2626;font-weight:600">'+esc(a.sel)+'</span>　正解：<span style="color:#16a34a;font-weight:600">'+esc(a.q.a)+'</span></div></div>';}}
  return '<div class="rh '+(r.passed?"ps":"fl")+'">'+'<div style="font-size:48px">'+(r.passed?"🎉":"📝")+'</div>'+'<div style="font-size:14px;color:rgba(255,255,255,0.8);font-weight:600">'+(r.passed?"合格！":"不合格")+'</div>'+'<div style="font-size:56px;font-weight:800;color:#fff;line-height:1">'+r.score+'%</div>'+'<div style="font-size:13px;color:rgba(255,255,255,0.7);margin-top:4px">'+r.correct+'/'+r.total+'問 - '+esc(r.name)+'</div>'+ss+'</div>'
    +'<div class="body" style="padding-top:16px">'+wh+'<div class="card"><div class="card-title">'+(wr.length>0?"間違えた問題":"結果")+'</div>'+wrh+'</div>'+'<div class="br"><button class="p1" onclick="go()">もう一度</button><button class="p2" onclick="hm()">ホーム</button></div></div>';
}

function rHi(){
  var h=S.hist;if(!h.length)return '<div class="hh"><button class="bb" onclick="hm()">← 戻る</button><h2 style="font-size:18px;font-weight:800;color:#1b2a4a">履歴</h2></div><div class="body" style="text-align:center;padding:40px;color:#94a3b8">記録なし</div>';
  var mx=0;var pc=0;for(var i=0;i<h.length;i++){if(h[i].score>mx)mx=h[i].score;if(h[i].passed)pc++;}
  var items="";for(var i=0;i<h.length;i++){var r=h[i];items+='<div class="card" style="padding:0"><div class="hi"><div class="hs" style="background:'+(r.passed?"#f0fdf4":"#fef2f2")+'"><span style="font-size:20px;font-weight:800;color:'+(r.passed?"#16a34a":"#dc2626")+'">'+r.score+'</span></div>'+'<div style="flex:1"><div style="font-size:13px;font-weight:700;color:#1b2a4a">'+(r.passed?"合格":"不合格")+' '+r.correct+'/'+r.total+(r.name?" - "+esc(r.name):"")+'</div>'+'<div style="font-size:11px;color:#94a3b8">'+r.date+'</div></div>'+'<div class="pg" style="background:'+(r.passed?"#dcfce7":"#fecaca")+';color:'+(r.passed?"#166534":"#991b1b")+'">'+(r.passed?"PASS":"FAIL")+'</div></div></div>';}
  return '<div class="hh"><button class="bb" onclick="hm()">← 戻る</button><h2 style="font-size:18px;font-weight:800;color:#1b2a4a">履歴</h2></div>'+'<div class="body"><div class="card card-dark"><div style="display:flex;justify-content:space-around;text-align:center">'+'<div><div style="font-size:24px;font-weight:800;color:'+CM+'">'+h.length+'</div><div style="font-size:10px;color:#94a3b8">受験</div></div>'+'<div><div style="font-size:24px;font-weight:800;color:#16a34a">'+pc+'</div><div style="font-size:10px;color:#94a3b8">合格</div></div>'+'<div><div style="font-size:24px;font-weight:800;color:#fff">'+mx+'%</div><div style="font-size:10px;color:#94a3b8">最高</div></div>'+'</div></div>'+items+'<button class="rb" onclick="rs()">履歴リセット</button></div>';
}

document.addEventListener("keydown",function(e){if(e.key==="Enter"){var ni=document.getElementById("ni");if(ni&&document.activeElement===ni)setN();}});
S.hist=lh();S.name=_ln();R();
</script>
