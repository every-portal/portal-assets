<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>持込パーツ・持込フィルムの対応について</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--dim:#64748b;--border:#e2e8f0;--accent:#059669;--warn:#dc2626;--ok:#059669;--info:#0891b2}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
.wrap{max-width:800px;margin:0 auto;padding:24px 20px 60px}
.header{background:linear-gradient(135deg,#065f46,#0d9488);padding:40px 28px 28px;border-radius:0 0 20px 20px;margin:-24px -20px 28px;color:#fff}
.header h1{font-size:22px;font-weight:800}
.header p{font-size:13px;color:#a7f3d0;margin-top:4px}
.tag{display:inline-block;font-size:10px;font-weight:700;color:#6ee7b7;background:rgba(110,231,183,0.15);padding:2px 10px;border-radius:20px;margin-bottom:8px;letter-spacing:1px}
.section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px}
.section h2{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section h3{font-size:14px;font-weight:700;margin:16px 0 8px;color:var(--accent)}
.section p,.section li{font-size:13px;color:#475569}
.section ul,.section ol{padding-left:20px}
.section li{margin-bottom:6px}
.warn{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px;color:var(--warn)}
.warn strong{color:#991b1b}
.info{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px;color:#0369a1}
.ok{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px;color:var(--ok)}
.step{display:flex;gap:12px;align-items:flex-start;margin:8px 0}
.step-num{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.step-text{font-size:13px;color:#475569;flex:1}
.qa{margin:10px 0;font-size:13px}
.qa strong{color:var(--accent)}
.qa em{font-style:normal;color:#475569}
.ng{color:#dc2626;font-weight:700}
.good{color:#059669;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
<div class="tag">CUSTOMER MANUAL</div>
<h1>持込パーツ・持込フィルムの対応について</h1>
<p>令和8年1月8日施行の社内規定</p>
</div>

<div class="section">
<h2>🚫 持込パーツ・持込フィルムの禁止</h2>
<p>これまでお客様持込のパーツでの修理、持込フィルムの貼付など個人判断としておりましたが、以下の通り禁止といたします。</p>
<div class="warn"><strong>⚠️ 禁止事項（令和8年1月8日施行）</strong>
<ul>
<li><strong>持込パーツでの修理</strong> — 禁止</li>
<li><strong>持込フィルムの貼付</strong> — 禁止</li>
<li><strong>端末を2台持ち込んでのパーツ移植</strong> — 禁止</li>
</ul></div>
</div>
</div>
</body>
</html>
